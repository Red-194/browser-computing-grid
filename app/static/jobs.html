<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Jobs - ComputeGrid</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >


    <style>

        /* ==========================================
           JOB PAGE
        ========================================== */

        .jobs-page {
            min-height: 100vh;
            padding: 34px;
        }


        /* ==========================================
           HEADER
        ========================================== */

        .jobs-header {
            position: relative;

            display: flex;
            align-items: center;

            min-height: 42px;

            margin-bottom: 28px;
        }


        .jobs-header h1 {
            margin: 0;

            font-size: 30px;

            color: var(--text);
        }


        /* ==========================================
           DASHBOARD BUTTON
        ========================================== */

        .jobs-header .back-btn {

            position: absolute;

            right: 0;
            top: 0;

            display: inline-flex;
            align-items: center;

            padding: 10px 15px;

            border: 1px solid var(--border);

            border-radius: 9px;

            background: var(--panel);

            color: var(--text);

            text-decoration: none;

            font-size: 13px;

            font-weight: 600;

            transition:
                background-color 0.2s ease,
                border-color 0.2s ease,
                color 0.2s ease;
        }


        .jobs-header .back-btn:hover {
            border-color: var(--accent);

            background: var(--panel-light);
        }


        /* ==========================================
           THEME BUTTON
        ========================================== */

        .jobs-header .jobs-theme-toggle {

            position: absolute;

            right: 125px;
            top: 2px;

            margin: 0;

            z-index: 10;
        }


        /* ==========================================
           MAIN LAYOUT
        ========================================== */

        .jobs-layout {

            display: grid;

            grid-template-columns:
                440px
                minmax(0, 1fr);

            gap: 24px;

            align-items: start;
        }


        /* ==========================================
           JOB PANELS
        ========================================== */

        .job-panel {

            background: var(--panel);

            border: 1px solid var(--border);

            border-radius: 14px;

            padding: 26px;
        }


        .job-panel h2 {

            margin: 0 0 22px;

            color: var(--text);

            font-size: 21px;
        }


        /* ==========================================
           WORKER STATUS
        ========================================== */

        .worker-status {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding: 8px 11px;

            margin-bottom: 24px;

            border-radius: 999px;

            background: rgba(57, 217, 138, 0.08);

            color: var(--green);

            font-size: 12px;

            font-weight: 600;
        }


        .worker-dot {

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: currentColor;
        }


        /* ==========================================
           FORM
        ========================================== */

        .form-section {

            padding: 20px 0;

            border-top: 1px solid var(--border);
        }


        .form-section:first-of-type {

            border-top: none;

            padding-top: 0;
        }


        .form-section-title {

            margin-bottom: 14px;

            color: var(--text);

            font-size: 14px;

            font-weight: 650;
        }


        .form-group {

            margin-bottom: 14px;
        }


        .form-group:last-child {

            margin-bottom: 0;
        }


        label {

            display: block;

            margin-bottom: 7px;

            color: var(--muted);

            font-size: 12px;
        }


        input,
        select {

            width: 100%;

            height: 42px;

            box-sizing: border-box;

            padding: 0 12px;

            border: 1px solid var(--border);

            border-radius: 8px;

            background: var(--bg);

            color: var(--text);

            font-size: 13px;

            outline: none;

            transition:
                background-color 0.2s ease,
                border-color 0.2s ease,
                color 0.2s ease;
        }


        input:focus,
        select:focus {

            border-color: var(--accent);
        }


        .two-column {

            display: grid;

            grid-template-columns:
                1fr
                1fr;

            gap: 12px;
        }


        /* ==========================================
           SUBMIT BUTTON
        ========================================== */

        .submit-btn {

            width: 100%;

            height: 44px;

            margin-top: 20px;

            border: none;

            border-radius: 9px;

            background: var(--accent);

            color: white;

            cursor: pointer;

            font-size: 13px;

            font-weight: 650;

            transition: opacity 0.2s ease;
        }


        .submit-btn:hover {

            opacity: 0.9;
        }


        .submit-btn:disabled {

            opacity: 0.45;

            cursor: not-allowed;
        }


        #jobStatus {

            margin-top: 12px;

            font-size: 12px;

            line-height: 1.5;
        }


        /* ==========================================
           JOB MONITOR
        ========================================== */

        #emptyMonitor {

            min-height: 260px;

            display: flex;

            align-items: center;

            justify-content: center;

            border: 1px dashed var(--border);

            border-radius: 10px;

            color: var(--muted);

            font-size: 13px;
        }


        #jobMonitor {

            display: none;
        }


        /* ==========================================
           SUMMARY
        ========================================== */

        .summary-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 12px;

            margin-bottom: 24px;
        }


        .summary-card {

            padding: 15px;

            border: 1px solid var(--border);

            border-radius: 9px;

            background: var(--bg);
        }


        .summary-card .label {

            margin-bottom: 7px;

            color: var(--muted);

            font-size: 11px;
        }


        .summary-card .value {

            color: var(--text);

            font-size: 14px;

            font-weight: 650;

            word-break: break-word;
        }


        /* ==========================================
           PROGRESS
        ========================================== */

        .progress-wrapper {

            margin-bottom: 24px;
        }


        .progress-label {

            display: flex;

            justify-content: space-between;

            margin-bottom: 8px;

            color: var(--muted);

            font-size: 12px;
        }


        .progress-bar {

            width: 100%;

            height: 7px;

            overflow: hidden;

            border-radius: 999px;

            background: var(--bg);
        }


        .progress-fill {

            width: 0%;

            height: 100%;

            border-radius: inherit;

            background: var(--accent);

            transition: width 0.3s ease;
        }


        /* ==========================================
           ASSIGNMENTS
        ========================================== */

        #jobMonitor h3 {

            margin: 0 0 12px;

            color: var(--text);

            font-size: 15px;
        }


        .assignments-wrapper {

            overflow-x: auto;

            border: 1px solid var(--border);

            border-radius: 9px;
        }


        .assignments-table {

            width: 100%;

            border-collapse: collapse;
        }


        .assignments-table th,
        .assignments-table td {

            padding: 11px 13px;

            border-bottom:
                1px solid var(--border);

            text-align: left;

            font-size: 12px;
        }


        .assignments-table th {

            color: var(--muted);

            font-weight: 600;
        }


        .assignments-table td {

            color: var(--text);
        }


        .assignments-table tr:last-child td {

            border-bottom: none;
        }


        /* ==========================================
           RESULT
        ========================================== */

        .result-area {

            display: none;

            margin-top: 24px;
        }


        .result-area h3 {

            margin: 0 0 12px;

            color: var(--text);

            font-size: 15px;
        }


        .result-preview {

            padding: 14px;

            border: 1px solid var(--border);

            border-radius: 10px;

            background: var(--bg);
        }


        .result-preview-label {

            margin-bottom: 12px;

            color: var(--muted);

            font-size: 11px;
        }


        .result-image {

            display: block;

            width: 100%;

            height: auto;

            border-radius: 7px;
        }


        /* ==========================================
           LIGHT THEME RESULT
        ========================================== */

        :root[data-theme="light"] .progress-bar {

            background: #e4e8f1;
        }


        :root[data-theme="light"] .result-preview {

            background: #f4f6fb;
        }


        /* ==========================================
           RESPONSIVE
        ========================================== */

        @media (max-width: 950px) {

            .jobs-layout {

                grid-template-columns: 1fr;
            }

        }


        @media (max-width: 600px) {

            .jobs-page {

                padding: 18px;
            }


            .jobs-header {

                align-items: flex-start;
            }


            .jobs-header h1 {

                font-size: 25px;

                padding-right: 130px;
            }


            .jobs-header .jobs-theme-toggle {

                right: 115px;
            }


            .jobs-header .back-btn {

                right: 0;
            }


            .two-column {

                grid-template-columns: 1fr;
            }


            .summary-grid {

                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<div class="jobs-page">


    <!-- ==========================================
         HEADER
    =========================================== -->

    <div class="jobs-header">


        <h1>
            Workload Jobs
        </h1>


        <a
            href="/dashboard"
            class="back-btn"
        >
            ← Dashboard
        </a>


    </div>



    <!-- ==========================================
         MAIN
    =========================================== -->

    <div class="jobs-layout">


        <!-- ======================================
             SUBMIT JOB
        ======================================= -->

        <section class="job-panel">


            <h2>
                Submit Workload
            </h2>


            <!-- WORKER STATUS -->

            <div class="worker-status">

                <span class="worker-dot"></span>

                <span id="workerStatus">
                    Checking workers...
                </span>

            </div>


            <!-- FORM -->

            <form id="jobForm">


                <!-- WORKLOAD -->

                <div class="form-section">


                    <div class="form-section-title">
                        Workload
                    </div>


                    <div class="form-group">


                        <label for="workload">
                            Type
                        </label>


                        <select
                            id="workload"
                            disabled
                        >

                            <option value="mandelbrot">
                                Mandelbrot
                            </option>

                        </select>


                    </div>


                </div>



                <!-- OUTPUT SIZE -->

                <div class="form-section">


                    <div class="form-section-title">
                        Output Size
                    </div>


                    <div class="two-column">


                        <div class="form-group">

                            <label for="width">
                                Width
                            </label>

                            <input
                                id="width"
                                type="number"
                                value="800"
                            >

                        </div>


                        <div class="form-group">

                            <label for="height">
                                Height
                            </label>

                            <input
                                id="height"
                                type="number"
                                value="600"
                            >

                        </div>


                    </div>


                </div>



                <!-- COMPUTATION -->

                <div class="form-section">


                    <div class="form-section-title">
                        Computation
                    </div>


                    <div class="two-column">


                        <div class="form-group">

                            <label for="maxIterations">
                                Max Iterations
                            </label>

                            <input
                                id="maxIterations"
                                type="number"
                                value="500"
                            >

                        </div>


                        <div class="form-group">

                            <label for="tileSize">
                                Tile Size
                            </label>

                            <input
                                id="tileSize"
                                type="number"
                                value="100"
                            >

                        </div>


                    </div>


                </div>



                <!-- COORDINATE RANGE -->

                <div class="form-section">


                    <div class="form-section-title">
                        Coordinate Range
                    </div>


                    <div class="two-column">


                        <div class="form-group">

                            <label for="xMin">
                                X Min
                            </label>

                            <input
                                id="xMin"
                                type="number"
                                step="any"
                                value="-2"
                            >

                        </div>


                        <div class="form-group">

                            <label for="xMax">
                                X Max
                            </label>

                            <input
                                id="xMax"
                                type="number"
                                step="any"
                                value="1"
                            >

                        </div>


                        <div class="form-group">

                            <label for="yMin">
                                Y Min
                            </label>

                            <input
                                id="yMin"
                                type="number"
                                step="any"
                                value="-1.5"
                            >

                        </div>


                        <div class="form-group">

                            <label for="yMax">
                                Y Max
                            </label>

                            <input
                                id="yMax"
                                type="number"
                                step="any"
                                value="1.5"
                            >

                        </div>


                    </div>


                </div>



                <!-- SUBMIT -->

                <button
                    id="submitBtn"
                    class="submit-btn"
                    type="submit"
                >
                    Submit Job
                </button>


                <div id="jobStatus"></div>


            </form>


        </section>



        <!-- ======================================
             JOB MONITOR
        ======================================= -->

        <section class="job-panel">


            <h2>
                Job Monitor
            </h2>


            <!-- EMPTY -->

            <div id="emptyMonitor">

                No job submitted yet.

            </div>


            <!-- MONITOR -->

            <div id="jobMonitor">


                <!-- SUMMARY -->

                <div class="summary-grid">


                    <div class="summary-card">

                        <div class="label">
                            Job ID
                        </div>

                        <div
                            id="jobId"
                            class="value"
                        >
                            -
                        </div>

                    </div>


                    <div class="summary-card">

                        <div class="label">
                            Tasks
                        </div>

                        <div
                            id="taskCount"
                            class="value"
                        >
                            -
                        </div>

                    </div>


                    <div class="summary-card">

                        <div class="label">
                            Status
                        </div>

                        <div
                            id="jobState"
                            class="value"
                        >
                            -
                        </div>

                    </div>


                </div>



                <!-- PROGRESS -->

                <div class="progress-wrapper">


                    <div class="progress-label">

                        <span>
                            Progress
                        </span>

                        <span id="progressText">
                            Waiting
                        </span>

                    </div>


                    <div class="progress-bar">

                        <div
                            id="progressFill"
                            class="progress-fill"
                        ></div>

                    </div>


                </div>



                <!-- ASSIGNMENTS -->

                <h3>
                    Task Assignments
                </h3>


                <div class="assignments-wrapper">


                    <table class="assignments-table">


                        <thead>

                            <tr>

                                <th>
                                    Task
                                </th>

                                <th>
                                    Worker
                                </th>

                                <th>
                                    Status
                                </th>

                            </tr>

                        </thead>


                        <tbody id="assignmentTable">
                        </tbody>


                    </table>


                </div>



                <!-- RESULT -->

                <div
                    id="resultArea"
                    class="result-area"
                >


                    <h3>
                        Result
                    </h3>


                    <div class="result-preview">


                        <div class="result-preview-label">
                            Mandelbrot Output
                        </div>


                        <img
                            id="resultImage"
                            class="result-image"
                            alt="Mandelbrot computation result"
                        >


                    </div>


                </div>


            </div>


        </section>


    </div>


</div>


<!-- THEME SCRIPT -->

<script src="/static/js/theme.js"></script>


<!-- EXISTING JOB SCRIPT -->

<script src="/static/js/jobs.js"></script>


</body>

</html>
