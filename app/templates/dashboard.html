<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Browser Computing Grid</title>

    <link rel="stylesheet" href="/static/css/style.css">

</head>

<body>

<div class="container">

    <h1>Browser Computing Grid</h1>

    <h3>Controller Dashboard</h3>

    <div class="card">

        <h2>Connected Workers</h2>

        <table>

            <thead>

            <tr>

                <th>UUID</th>
                <th>IP Address</th>
                <th>Status</th>
                <th>CPU Cores</th>
                <th>Memory (GB)</th>
                <th>Latency (ms)</th>

            </tr>

            </thead>

            <tbody id="workerTable">

            <tr>

                <td colspan="5">

                    No workers connected.

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

<script src="/static/js/dashboard.js"></script>

</body>

</html>
