<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WASM Runtime Test</title>
</head>
<body>
    <h1>WASM Runtime Test</h1>
    <div id="output" style="white-space: pre-wrap; font-family: monospace;"></div>
    <script type="module">
        import init, { execute_task } from './pkg/runtime.js';

        async function runTests() {
            const output = document.getElementById('output');
            const log = (msg) => {
                output.textContent += msg + '\n';
                console.log(msg);
            };

            try {
                // Initialize the WASM module
                log('Initializing WASM module...');
                await init();
                log('WASM module initialized successfully!\n');

                // Test Monte Carlo
                log('--- Testing Monte Carlo ---');
                // Note: u64 values in Rust deserialize from BigInt in JS
                const mcInput = { samples: 100000, seed: 1234n }; 
                log(`Input: { samples: 100000, seed: 1234n }`);
                
                const mcOutput = execute_task('monte_carlo', mcInput);
                log(`Output: ${JSON.stringify(mcOutput)}\n`);

                // Test Mandelbrot
                log('--- Testing Mandelbrot ---');
                const mbInput = {
                    width: 10,
                    height: 10,
                    x_min: -2.0,
                    x_max: 1.0,
                    y_min: -1.5,
                    y_max: 1.5,
                    max_iterations: 100,
                    tile_size: 10,
                    row_block: 0,
                    col_block: 0
                };
                log(`Input: ${JSON.stringify(mbInput)}`);
                
                const mbOutput = execute_task('mandelbrot', mbInput);
                // mbOutput.pixel_buffer will be a Uint8Array or similar
                log(`Output: pixel_buffer length = ${mbOutput.pixel_buffer.length}, row_block = ${mbOutput.row_block}\n`);

                log('All tests executed!');
            } catch (err) {
                log(`Error: ${err}`);
                console.error(err);
            }
        }

        runTests();
    </script>
</body>
</html>
